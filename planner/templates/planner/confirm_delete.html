{% extends "planner/base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}
<h1>Delete {{ object }}?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="javascript:history.back()" role="button" class="secondary">Cancel</a>
</form>
{% endblock %}
